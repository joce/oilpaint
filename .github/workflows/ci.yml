name: CI

# On every pull request, on every push to main (merged pull requests included),
# and by hand from the Actions tab.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# A newer push to the same pull request replaces its run; runs on main all finish.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test:
    name: Tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # the oldest and the newest Python that numba supports
        python: ["3.10", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: pip install -e ".[test,pil]"
      - name: Run the tests
        run: pytest -q tests
