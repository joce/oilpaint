name: CI

# On every pull request, on every push to main (merged pull requests included),
# and by hand from the Actions tab.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# A newer push to the same pull request replaces its run; runs on main all finish.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

# A Python version tox cannot find fails the run (locally, tox.ini skips it).
env:
  TOX_SKIP_MISSING_INTERPRETERS: "false"

jobs:
  spell-check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Check spelling
        run: npm run spell

  ci-checks:
    needs: spell-check
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14", "3.15"]
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # tags needed for hatch-vcs version

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "latest"
          python-version: ${{ matrix.python-version }}

      # formatting (black, ruff format), lint (ruff), types (pyright), tests (pytest)
      - name: Run tox
        run: uvx --with tox-uv tox -e py${{ matrix.python-version }}

  distribution-and-windows:
    needs: spell-check
    runs-on: windows-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # tags needed for hatch-vcs version

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "latest"
          python-version: "3.15"

      # the tests on Windows, and the built wheel installed and used on its own
      - name: Check Windows behavior and installed distribution
        run: uvx --with tox-uv tox -e test,wheel

  coverage:
    needs: spell-check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # Codecov checks the upload with GitHub's OIDC token: no secret needed
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # tags needed for hatch-vcs version

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "latest"
          python-version: "3.15"

      - name: Run coverage via tox
        run: uvx --with tox-uv tox -e coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: coverage.xml
          use_oidc: true
          verbose: true

      - name: Upload test results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@v7
        with:
          files: junit.xml
          report_type: test_results
          use_oidc: true
