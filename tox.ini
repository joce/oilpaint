[tox]
envlist = py{3.11,3.12,3.13,3.14,3.15}, spell, wheel
isolated_build = true
skip_missing_interpreters = true
requires = tox-uv >= 1.35

[testenv]
description = Run checks for Python {envname}
runner = uv-venv-lock-runner
dependency_groups =
    dev
setenv =
    py3.11: PYRIGHT_PYTHON_VERSION = 3.11
    py3.12: PYRIGHT_PYTHON_VERSION = 3.12
    py3.13: PYRIGHT_PYTHON_VERSION = 3.13
    py3.14: PYRIGHT_PYTHON_VERSION = 3.14
    py3.15: PYRIGHT_PYTHON_VERSION = 3.15
commands =
    black --check --diff .
    ruff format --check --quiet --diff --target-version py311 .
    ruff check --target-version py311 .
    pyright --pythonversion {env:PYRIGHT_PYTHON_VERSION}
    pytest

[testenv:check]
description = Run checks once on the current Python version
commands =
    black --check --diff .
    ruff format --check --quiet --diff --target-version py311 .
    ruff check --target-version py311 .
    pyright
    pytest

[testenv:test]
description = Run only tests
commands =
    pytest

[testenv:spell]
description = Run spell check
skip_install = true
allowlist_externals =
    npm
commands =
    npm run spell

[testenv:coverage]
description = Run pytest with coverage reporting
dependency_groups =
    dev
setenv =
    COVERAGE_MINIMUM = 80
commands =
    pytest \
        --cov=oilpaint \
        --cov-report=xml:coverage.xml \
        --cov-report=term-missing \
        --cov-fail-under={env:COVERAGE_MINIMUM} \
        --junitxml=junit.xml -o junit_family=legacy \
        {posargs}

[testenv:wheel]
description = Smoke-test the installed wheel without source-tree imports
runner = uv-venv-runner
package = wheel
dependency_groups =
changedir = {env:TMPDIR:{env:TEMP:/tmp}}
allowlist_externals = uv
commands =
    uv run --no-project --python {envpython} python -I {toxinidir}/tools/check_wheel.py
