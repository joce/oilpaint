[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "oilpaint"
version = "0.1.0"
description = "A small oil-painting simulator: spline brush strokes with physically based (spectral Kubelka-Munk) paint mixing."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.22", "numba>=0.57"]

[project.optional-dependencies]
pil = ["Pillow"]
test = ["pytest"]

[tool.setuptools]
packages = ["oilpaint"]
