[project]
name = "oilpaint"
dynamic = ["version"]
description = "A small oil-painting simulator: spline brush strokes with physically based (spectral Kubelka-Munk) paint mixing."
readme = "README.md"
authors = [{ name = "Jocelyn Legault", email = "jocelynlegault@gmail.com" }]
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11, <4.0"
keywords = [
    "painting",
    "oil-paint",
    "simulation",
    "kubelka-munk",
    "color-mixing",
    "brush",
    "impasto",
    "generative-art",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Artistic Software",
    "Topic :: Multimedia :: Graphics",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = ["numpy>=1.24", "numba>=0.57"]

[project.optional-dependencies]
pil = ["Pillow>=9.1"]

[project.urls]
Homepage = "https://github.com/joce/oilpaint"
Repository = "https://github.com/joce/oilpaint"
Issues = "https://github.com/joce/oilpaint/issues"
Changelog = "https://github.com/joce/oilpaint/blob/main/CHANGELOG.md"

[dependency-groups]
tox = [
    "tox>=4.53,<5.0",
    "tox-uv>=1.35,<2.0",
]
dev = [
    { include-group = "tox" },
    "black>=25.9,<27.0",
    "coverage>=7.15.0,<8.0",
    "pillow>=10.0",
    "pyright>=1.1.409,<2.0",
    "pytest>=9.0,<10.0",
    "pytest-cov>=7.0,<8.0",
    "ruff>=0.15,<1.0",
]

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.hooks.vcs]
version-file = "oilpaint/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["oilpaint"]

[tool.hatch.build.targets.sdist]
include = [
    "oilpaint",
    "tests",
    "tools",
    "CHANGELOG.md",
    "LICENSE",
    "README.md",
    "RELEASING.md",
    "pyproject.toml",
    "tox.ini",
]

[tool.black]
target-version = ["py311"]
line-length = 88

[tool.pyright]
include = ["oilpaint", "tests", "examples", "tools"]
typeCheckingMode = "standard"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["oilpaint"]
# Compiled by numba: coverage.py can't see inside it, so it would read as
# untested though every test runs it. (With NUMBA_DISABLE_JIT=1 it runs as
# plain Python and can be measured, but the tests then take over 50 minutes.)
omit = ["oilpaint/_engine.py"]

[tool.coverage.report]
show_missing = true
skip_covered = true
precision = 2

[tool.coverage.html]
directory = "htmlcov"

[tool.ruff]
exclude = [
    "__pycache__",
    ".git",
    ".pytest_cache",
    ".ruff_cache",
    ".tox",
    ".uv-cache",
    ".venv",
    ".vscode",
    "node_modules",
]
line-length = 88
indent-width = 4
target-version = "py311"

[tool.ruff.format]
# (the code samples in the README keep their hand-aligned comments)
exclude = ["*.md"]
indent-style = "space"
line-ending = "lf"
quote-style = "double"
skip-magic-trailing-comma = false

[tool.ruff.lint]
# A core set for now; yoghurt's stricter families (annotations, docstrings,
# naming, pylint, ...) can be turned on one at a time later.
select = [
    "F",
    "E",
    "W",
    "I",
    "UP",
    "B",
    "A",
    "C90",
    "C4",
    "SIM",
    "PIE",
    "PERF",
    "FURB",
    "RET",
    "ISC",
    "Q",
    "NPY",
    "PGH",
    "T10",
    "YTT",
    "ICN",
    "FLY",
    "RUF",
]
fixable = ["ALL"]
unfixable = []
ignore = [
    # `[x] + rest` -> `[x, *rest]` changes the meaning when `rest` is a numpy array
    "collection-literal-concatenation",
    # exact float comparisons here are deliberate (defaults, stored values, exact zeros)
    "float-equality-comparison",
    # numpy and numba scalars: explicit int() casts stay, even where Python's are redundant
    "unnecessary-cast-to-int",
]
preview = true

[tool.ruff.lint.mccabe]
# The most branches any function outside the compiled kernels has: a function
# that grows past it is split.
max-complexity = 13

[tool.ruff.lint.per-file-ignores]
# The compiled kernels keep their loops in one function (numba compiles each
# call), and the example paintings are long scripts of marks.
"oilpaint/_engine.py" = ["complex-structure"]
"examples/*" = ["complex-structure"]

[build-system]
requires = ["hatchling>=1.29,<2.0", "hatch-vcs>=0.4,<1.0"]
build-backend = "hatchling.build"
